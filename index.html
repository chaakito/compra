<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Compra</title>
<!-- Al añadirla a la pantalla de inicio del iPhone: icono propio y pantalla completa, sin barra de Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compra">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --bg: #f4f4f1; --muted: #8a8a85; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --muted: #8d8d88; } }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  /* La app de Google ocupa toda la pantalla; ella misma deja sitio a la muesca y a la barra de inicio */
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  #probe {
    position: fixed; visibility: hidden; pointer-events: none;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  }
  .loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    font: 15px -apple-system, system-ui, sans-serif; color: var(--muted);
  }
</style>
</head>
<body>
<div class="loading">Cargando…</div>
<div id="probe"></div>
<iframe id="app" title="Lista de la compra" allow="clipboard-write"></iframe>
<script>
  // Mide la zona segura de este iPhone y se la pasa a la app (dentro de los marcos de Google no se puede medir bien).
  var cs = getComputedStyle(document.getElementById('probe'));
  var st = Math.round(parseFloat(cs.paddingTop) || 0);
  var sb = Math.round(parseFloat(cs.paddingBottom) || 0);
  document.getElementById('app').src =
    'https://script.google.com/macros/s/AKfycby3IDHS9oTtDfsjsYWedcUTkBoDOXbs6V9PcdJLZIHr0fnAsuvxPgfc8I8vQa5jbrE8/exec' +
    '?st=' + st + '&sb=' + sb;
</script>
</body>
</html>
